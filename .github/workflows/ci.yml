name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Compact compiler
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        with:
          compact-version: "0.31.1"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Update npm
        run: npm install --global npm@11.11.0

      - name: Install dependencies
        run: npm ci

      - name: Compile Compact bindings and ZKIR
        run: npm run compact:skip-zk

      - name: Check compiler output freshness and rejection rules
        run: npm run test:compiler-check && npm run compact:check-source

      - name: Compile and test isolated escrow compatibility experiment
        run: node experiments/escrow/check.mjs

      - name: Build dependencies, typecheck, and test current artifacts
        run: npm run validate

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Test retirement across filesystem and SQLite replicas
        run: node scripts/test-retirement-lifecycle.mjs

      - name: Test release artifact rejection rules
        run: npm run test:release

      - name: Reject invalid public build configuration
        run: npm run test:web-environment

      - name: Install browser for desktop and mobile journeys
        run: npx playwright install --with-deps chrome

      - name: Test production UI against the ciphertext service
        run: npm run test:e2e

      - name: Test ciphertext replication against two independent stores
        run: npm run test:e2e:replication
      - name: Test filesystem and SQLite replication
        run: npm run test:e2e:cross-adapter

  cipherstore-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js for the container drill
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Validate deployment configuration
        run: docker compose -f infra/cipherstore.yml config --quiet
      - name: Build the ciphertext service image
        run: docker build -f infra/cipherstore.Dockerfile -t vulnseal-cipherstore:local .
      - name: Verify container persistence, capacity and restart
        run: node scripts/test-cipherstore-container.mjs
      - name: Verify SQLite container persistence, capacity and restart
        run: node scripts/test-cipherstore-container.mjs --backend=sqlite
      - name: Verify native SQLite full-database recovery
        run: >-
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges:true
          --memory 512m --pids-limit 64 --tmpfs /data:rw,noexec,nosuid,size=64k,mode=1777
          --mount type=bind,source=${{ github.workspace }}/scripts/test-sqlite-full.mjs,target=/probe/scripts/test-sqlite-full.mjs,readonly
          --env VULNSEAL_SQLITE_MODULE=file:///app/dist/sqlite-storage.js
          --entrypoint node vulnseal-cipherstore:local /probe/scripts/test-sqlite-full.mjs
      - name: Reject runtime vulnerabilities and end-of-life OS
        run: sh scripts/scan-container.sh
      - name: Verify internal metrics collection and alert rules
        run: |
          docker compose -f infra/cipherstore.yml -f infra/cipherstore-monitoring.yml build prometheus
          node scripts/test-cipherstore-monitoring.mjs
