name: Release verification

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  go-source-diagnostics:
    name: Go source diagnostic (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: caddy
            dockerfile: infra/caddy-source-check.Dockerfile
            target: ""
          - component: prometheus
            dockerfile: infra/prometheus.Dockerfile
            target: source-check
    env:
      DIAGNOSTIC_IMAGE: vulnseal-go-source:${{ matrix.component }}
      DIAGNOSTIC_CONTAINER: vulnseal-go-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.component }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the pinned source diagnostic
        timeout-minutes: 30
        env:
          DIAGNOSTIC_DOCKERFILE: ${{ matrix.dockerfile }}
          DIAGNOSTIC_TARGET: ${{ matrix.target }}
        run: |
          args=()
          if [ -n "$DIAGNOSTIC_TARGET" ]; then args+=(--target "$DIAGNOSTIC_TARGET"); fi
          docker build "${args[@]}" -f "$DIAGNOSTIC_DOCKERFILE" -t "$DIAGNOSTIC_IMAGE" .
          docker image inspect "$DIAGNOSTIC_IMAGE" --format '{{.Id}}'
      - name: Analyze source with bounded resources
        timeout-minutes: 17
        env:
          DIAGNOSTIC_COMPONENT: ${{ matrix.component }}
        run: |
          args=(-show verbose,traces ./...)
          if [ "$DIAGNOSTIC_COMPONENT" = prometheus ]; then
            args=(-tags netgo,builtinassets -show verbose,traces ./cmd/prometheus ./cmd/promtool)
          fi
          docker run --name "$DIAGNOSTIC_CONTAINER" --label "vulnseal.go-source-ci=$DIAGNOSTIC_CONTAINER" \
            --memory 3g --cpus 2 --pids-limit 512 --env GOMEMLIMIT=2GiB --env GOMAXPROCS=2 \
            --entrypoint timeout "$DIAGNOSTIC_IMAGE" 900 govulncheck "${args[@]}"
      - name: Inspect and remove the owned diagnostic container
        if: always()
        run: |
          exists=$(timeout -k 5s 20s docker container ls -aq --filter "name=^/${DIAGNOSTIC_CONTAINER}$")
          if [ -n "$exists" ]; then
            owner=$(timeout -k 5s 20s docker inspect "$DIAGNOSTIC_CONTAINER" --format '{{index .Config.Labels "vulnseal.go-source-ci"}}')
            test "$owner" = "$DIAGNOSTIC_CONTAINER"
            timeout -k 5s 20s docker inspect "$DIAGNOSTIC_CONTAINER" --format '{{json .State}}'
            timeout -k 5s 30s docker rm --force --volumes "$DIAGNOSTIC_CONTAINER"
          fi

  network-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Compact compiler
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        with:
          compact-version: "0.31.1"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate fresh bindings, binary ZKIR and all proving keys
        timeout-minutes: 30
        run: npm run compact
      - name: Validate the freshly generated artifacts
        run: npm run validate
      - name: Build and check the complete web release
        run: npm run release:build && npm run release:check
      - name: Install browser for desktop and mobile hosting checks
        run: npx playwright install --with-deps chrome
      - name: Validate web deployment configuration
        run: docker compose -f infra/web.yml config --quiet
      - name: Build the checked web hosting image
        run: docker build -f infra/web.Dockerfile -t vulnseal-web:local .
      - name: Verify served bytes, browser lookup and container restart
        run: node scripts/test-web-container.mjs
      - name: Scan the exact web runtime image
        run: sh scripts/scan-container.sh vulnseal-web:local

  monitoring-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the configured collector image
        run: docker compose -f infra/cipherstore.yml -f infra/cipherstore-monitoring.yml build prometheus
      - name: Scan the configured collector image
        run: |
          image=$(docker compose -f infra/cipherstore.yml -f infra/cipherstore-monitoring.yml config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["prometheus"]["image"])')
          sh scripts/scan-container.sh "$image"
