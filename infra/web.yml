# SPDX-License-Identifier: Apache-2.0
services:
  web:
    image: vulnseal-web:local
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PUBLISHED_PORT:-8080}:8080"
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
