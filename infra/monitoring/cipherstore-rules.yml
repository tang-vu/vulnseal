groups:
  - name: cipherstore
    rules:
      - alert: CipherstoreStorageNotReady
        expr: (vulnseal_storage_ready{job="cipherstore"} == 0) and on (job, instance) (up{job="cipherstore"} == 1)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Cipherstore storage is not ready for new writes
          description: Check capacity and storage access. Existing ciphertext may remain readable; do not delete it or automatically retry transactions.
      - alert: CipherstoreMetricsUnavailable
        expr: up{job="cipherstore"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Cipherstore metrics cannot be scraped
          description: Check the service, metrics setting and internal network. Do not delete ciphertext or automatically retry transactions.
      - alert: CipherstoreServerErrors
        expr: sum by (job, instance) (rate(vulnseal_http_responses_total{job="cipherstore",status_class="5xx"}[5m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Cipherstore has recent HTTP server errors
          description: Inspect readiness, capacity and storage. This includes quota and readiness refusals; existing ciphertext may remain readable.
