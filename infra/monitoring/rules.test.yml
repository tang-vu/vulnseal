rule_files:
  - cipherstore-rules.yml
evaluation_interval: 15s
tests:
  - interval: 1m
    input_series:
      - series: 'up{job="cipherstore",instance="cipherstore:8787"}'
        values: '1 1 1 1 1 0 0 0 0'
      - series: 'vulnseal_storage_ready{job="cipherstore",instance="cipherstore:8787"}'
        values: '0 0 0 1 1 0 0 0 0'
    alert_rule_test:
      - eval_time: 1m
        alertname: CipherstoreStorageNotReady
        exp_alerts: []
      - eval_time: 2m
        alertname: CipherstoreStorageNotReady
        exp_alerts:
          - exp_labels:
              job: cipherstore
              instance: cipherstore:8787
              severity: warning
            exp_annotations:
              summary: Cipherstore storage is not ready for new writes
              description: Check capacity and storage access. Existing ciphertext may remain readable; do not delete it or automatically retry transactions.
      - eval_time: 3m
        alertname: CipherstoreStorageNotReady
        exp_alerts: []
      - eval_time: 8m
        alertname: CipherstoreStorageNotReady
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'up{job="cipherstore",instance="cipherstore:8787"}'
        values: '0 0 0 1 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: CipherstoreMetricsUnavailable
        exp_alerts: []
      - eval_time: 2m
        alertname: CipherstoreMetricsUnavailable
        exp_alerts:
          - exp_labels:
              job: cipherstore
              instance: cipherstore:8787
              severity: warning
            exp_annotations:
              summary: Cipherstore metrics cannot be scraped
              description: Check the service, metrics setting and internal network. Do not delete ciphertext or automatically retry transactions.
      - eval_time: 3m
        alertname: CipherstoreMetricsUnavailable
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'vulnseal_http_responses_total{job="cipherstore",instance="cipherstore:8787",status_class="5xx"}'
        values: '0+1x10'
    alert_rule_test:
      - eval_time: 2m
        alertname: CipherstoreServerErrors
        exp_alerts: []
      - eval_time: 3m
        alertname: CipherstoreServerErrors
        exp_alerts:
          - exp_labels:
              job: cipherstore
              instance: cipherstore:8787
              severity: warning
            exp_annotations:
              summary: Cipherstore has recent HTTP server errors
              description: Inspect readiness, capacity and storage. This includes quota and readiness refusals; existing ciphertext may remain readable.
